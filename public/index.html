<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分工小助手 · 什么事找谁</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #ededed;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    box-shadow: 0 0 24px rgba(0,0,0,.08);
  }
  header {
    background: #0082EF;
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  header .avatar {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: #fff;
    color: #0082EF;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    font-weight: 700;
  }
  header .title { font-size: 17px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.me { flex-direction: row-reverse; }
  .bubble-avatar {
    width: 36px; height: 36px;
    border-radius: 6px;
    background: #0082EF;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    font-weight: 700;
  }
  .bubble {
    max-width: 76%;
    padding: 10px 13px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.65;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .row.bot .bubble { background: #fff; color: #1a1a1a; border-top-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .row.me .bubble { background: #95EC69; color: #10240c; border-top-right-radius: 2px; }
  .row.me .bubble.pending { background: #d4e6c3; color: #5a6b4f; }
  .sys-tip {
    align-self: center;
    background: rgba(0,0,0,.06);
    color: #888;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 14px 4px;
    flex-shrink: 0;
  }
  .chip {
    background: #fff;
    border: 1px solid #dfe6ee;
    color: #0082EF;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 16px;
    cursor: pointer;
    transition: background .15s;
  }
  .chip:active { background: #e8f4ff; }
  footer {
    flex-shrink: 0;
    background: #f7f7f7;
    border-top: 1px solid #e2e2e2;
    padding: 9px 10px;
    padding-bottom: calc(9px + env(safe-area-inset-bottom));
    display: flex;
    gap: 9px;
    align-items: flex-end;
  }
  footer textarea {
    flex: 1;
    resize: none;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 96px;
    background: #fff;
    outline: none;
  }
  footer textarea:focus { border-color: #0082EF; }
  .send-btn {
    background: #0082EF;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send-btn:disabled { background: #a8d4f8; }
  .send-btn:active { transform: scale(.96); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px;
    background: #bbb;
    border-radius: 50%;
    animation: blink 1.2s infinite both;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
</style>
</head>
<body>
<header>
  <div class="avatar">🤖</div>
  <div>
    <div class="title">分工小助手</div>
    <div class="sub">什么事找谁，一句话问清楚</div>
  </div>
</header>

<main id="chat"></main>

<div class="chips" id="chips">
  <button class="chip" data-q="报销被驳回了找谁">报销被驳回</button>
  <button class="chip" data-q="社保要停缴">社保停缴</button>
  <button class="chip" data-q="下周出差帮我订机票">出差订票</button>
  <button class="chip" data-q="货要加急配货">加急配货</button>
  <button class="chip" data-q="工资条怎么看">工资条</button>
  <button class="chip" data-q="客户说要来仓库参观">客户到访</button>
  <button class="chip" data-q="合同要盖章">盖章</button>
</div>

<footer>
  <textarea id="input" rows="1" placeholder="用大白话问，例如：报销被驳回了找谁？" enterkeyhint="send"></textarea>
  <button class="send-btn" id="send">发送</button>
</footer>

<script>
(function () {
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var sending = false;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function scrollBottom() {
    requestAnimationFrame(function () {
      chat.scrollTop = chat.scrollHeight;
    });
  }

  function addBot(text) {
    var row = el('div', 'row bot');
    row.appendChild(el('div', 'bubble-avatar', '🤖'));
    row.appendChild(el('div', 'bubble', text));
    chat.appendChild(row);
    scrollBottom();
  }

  function addMe(text, pending) {
    var row = el('div', 'row me');
    var b = el('div', 'bubble' + (pending ? ' pending' : ''), text);
    row.appendChild(b);
    chat.appendChild(row);
    scrollBottom();
    return b;
  }

  function addTyping() {
    var row = el('div', 'row bot');
    row.appendChild(el('div', 'bubble-avatar', '🤖'));
    var bubble = el('div', 'bubble');
    var t = el('div', 'typing');
    t.appendChild(el('i'));
    t.appendChild(el('i'));
    t.appendChild(el('i'));
    bubble.appendChild(t);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollBottom();
    return row;
  }

  function ask(q) {
    q = (q || '').trim();
    if (!q || sending) return;
    sending = true;
    sendBtn.disabled = true;
    addMe(q);
    var typingRow = addTyping();
    var started = Date.now();

    fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: q })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var wait = Math.max(0, 450 - (Date.now() - started)); // 至少显示一下输入动画
      setTimeout(function () {
        chat.removeChild(typingRow);
        addBot(d.answer || '出了点小问题，再问一次试试～');
        sending = false;
        sendBtn.disabled = false;
      }, wait);
    })
    .catch(function () {
      chat.removeChild(typingRow);
      addBot('网络开小差了，请再发一次试试～');
      sending = false;
      sendBtn.disabled = false;
    });
  }

  sendBtn.addEventListener('click', function () {
    ask(input.value);
    input.value = '';
    input.style.height = 'auto';
    input.focus();
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 96) + 'px';
  });

  document.getElementById('chips').addEventListener('click', function (e) {
    if (e.target.classList.contains('chip')) ask(e.target.dataset.q);
  });

  // 开场白
  addBot('你好呀，我是分工小助手 👋\n\n什么事该找哪个部门、找哪位同事，直接用大白话问我。\n\n比如点下面的问题试试，或者直接输入：\n「报销被驳回了找谁」');
})();
</script>
</body>
</html>

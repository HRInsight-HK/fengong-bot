<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分工小助手 · 什么事找谁</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #eef1f5;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    box-shadow: 0 0 32px rgba(16,42,82,.12);
  }

  /* ===== 顶部 ===== */
  header {
    background: linear-gradient(135deg, #0082ef 0%, #0064c8 100%);
    color: #fff;
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    padding-top: calc(14px + env(safe-area-inset-top));
    box-shadow: 0 2px 10px rgba(0,100,200,.25);
    position: relative;
    z-index: 2;
  }
  header .avatar {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  header .title { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  header .sub { font-size: 12px; opacity: .9; margin-top: 3px; display: flex; align-items: center; gap: 5px; }
  header .sub .dot { width: 6px; height: 6px; border-radius: 50%; background: #6effa8; box-shadow: 0 0 6px #6effa8; }
  header .badge-row { margin-left: auto; text-align: right; font-size: 11px; line-height: 1.7; opacity: .92; }
  header .badge-row b { font-size: 13px; color: #ffe28a; }

  /* ===== 聊天区 ===== */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: linear-gradient(180deg, #f6f8fb 0%, #eef1f5 100%);
  }
  .sys-tip {
    align-self: center;
    background: rgba(23,67,110,.07);
    color: #7c8794;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
  }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.me { flex-direction: row-reverse; }
  .bubble-avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #0082ef, #0064c8);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,100,200,.3);
  }
  .bubble {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.7;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .row.bot .bubble {
    background: #fff;
    color: #1a1a1a;
    border-top-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(16,42,82,.08);
  }
  .row.bot .bubble.wide { max-width: 95%; white-space: normal; overflow-x: auto; }
  .row.me .bubble {
    background: linear-gradient(160deg, #8be86b, #6fdd4d);
    color: #10240c;
    border-top-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(88,180,50,.25);
  }
  .row.me .bubble.pending { background: #d4e6c3; color: #5a6b4f; }

  /* ===== 表格 ===== */
  .tbl-title {
    font-size: 13.5px;
    color: #17436e;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tbl-title::before {
    content: '';
    width: 4px; height: 14px;
    border-radius: 2px;
    background: linear-gradient(180deg, #0082ef, #0064c8);
    display: inline-block;
  }
  .tbl-wrap {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #e6ecf3;
    min-width: 340px;
  }
  table.qtable { border-collapse: collapse; width: 100%; font-size: 13px; }
  .qtable th {
    background: linear-gradient(180deg, #f7fbff, #ecf5fe);
    color: #17436e;
    padding: 8px 10px;
    text-align: left;
    font-weight: 700;
    white-space: nowrap;
    border-bottom: 1px solid #d8e6f4;
    font-size: 12.5px;
  }
  .qtable td {
    padding: 8px 10px;
    border-bottom: 1px solid #f0f4f8;
    vertical-align: top;
    line-height: 1.55;
    color: #333;
  }
  .qtable tbody tr:last-child td { border-bottom: none; }
  .qtable tbody tr:nth-child(even) { background: #f9fcff; }
  .qtable td.c-badge { white-space: nowrap; }
  .qtable .badge {
    display: inline-block;
    background: #e8f3ff;
    color: #0064c8;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
    font-weight: 500;
  }
  .qtable td.c-person { color: #0082ef; font-weight: 700; white-space: nowrap; }
  .qtable td.c-backup { color: #97a1ad; white-space: nowrap; }
  .tbl-foot {
    font-size: 12px;
    color: #97a1ad;
    margin-top: 7px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ===== 快捷区 ===== */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 9px 12px 3px;
    flex-shrink: 0;
    background: #fff;
    border-top: 1px solid #e8edf2;
  }
  .chip {
    background: #f3f8fe;
    border: 1px solid #d9e9fb;
    color: #0064c8;
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 18px;
    cursor: pointer;
    transition: all .15s;
    font-weight: 500;
  }
  .chip:active { background: #d9ecff; transform: scale(.95); }
  .chip.dept { background: #fff7ec; border-color: #fde3c3; color: #b06a00; }

  /* ===== 输入区 ===== */
  footer {
    flex-shrink: 0;
    background: #fff;
    border-top: 1px solid #e8edf2;
    padding: 10px 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 9px;
    align-items: flex-end;
  }
  footer textarea {
    flex: 1;
    resize: none;
    border: 1.5px solid #e0e6ec;
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 96px;
    background: #f8fafc;
    outline: none;
    transition: border-color .15s, background .15s;
  }
  footer textarea:focus { border-color: #0082ef; background: #fff; }
  .send-btn {
    background: linear-gradient(135deg, #0082ef, #0064c8);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(0,100,200,.3);
    transition: transform .12s;
  }
  .send-btn:disabled { background: #a8d4f8; box-shadow: none; }
  .send-btn:active { transform: scale(.94); }

  .typing { display: inline-flex; gap: 4px; padding: 5px 2px; }
  .typing i {
    width: 6px; height: 6px;
    background: #b6c3d1;
    border-radius: 50%;
    animation: blink 1.2s infinite both;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
</style>
</head>
<body>
<header>
  <div class="avatar">🤖</div>
  <div>
    <div class="title">分工小助手</div>
    <div class="sub"><span class="dot"></span>在线 · 什么事找谁，一句话问清楚</div>
  </div>
  <div class="badge-row">9 大板块<br><b>91 条</b>对接事项</div>
</header>

<main id="chat"></main>

<div class="chips" id="chips">
  <button class="chip" data-q="报销被驳回了找谁">💰 报销被驳回</button>
  <button class="chip" data-q="社保要停缴">🛡 社保停缴</button>
  <button class="chip" data-q="下周出差帮我订机票">✈️ 出差订票</button>
  <button class="chip" data-q="货要加急配货">🚚 加急配货</button>
  <button class="chip" data-q="合同要盖章">📄 盖章</button>
  <button class="chip dept" data-q="香港">📦 香港仓库表</button>
  <button class="chip dept" data-q="内贸销售">🏬 内贸销售表</button>
  <button class="chip dept" data-q="总务">🗂 总务部表</button>
  <button class="chip dept" data-q="自营平台">🛒 自营平台表</button>
  <button class="chip dept" data-q="采购">🧾 采购部表</button>
  <button class="chip dept" data-q="人事">👥 人事部表</button>
</div>

<footer>
  <textarea id="input" rows="1" placeholder="用大白话问，例如：报销被驳回了找谁？" enterkeyhint="send"></textarea>
  <button class="send-btn" id="send">发送</button>
</footer>

<script>
(function () {
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var sending = false;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function scrollBottom() {
    requestAnimationFrame(function () {
      chat.scrollTop = chat.scrollHeight;
    });
  }

  function addSysTip(text) {
    chat.appendChild(el('div', 'sys-tip', text));
    scrollBottom();
  }

  function addBot(text) {
    var row = el('div', 'row bot');
    row.appendChild(el('div', 'bubble-avatar', '🤖'));
    row.appendChild(el('div', 'bubble', text));
    chat.appendChild(row);
    scrollBottom();
  }

  /** 机器人回复：有 table 时渲染表格，否则纯文本 */
  function addBotRich(d) {
    var row = el('div', 'row bot');
    row.appendChild(el('div', 'bubble-avatar', '🤖'));
    var t = d && d.table;
    if (t && t.rows && t.rows.length) {
      var bubble = el('div', 'bubble wide');
      bubble.appendChild(el('div', 'tbl-title', t.title || ''));
      var wrap = el('div', 'tbl-wrap');
      var table = document.createElement('table');
      table.className = 'qtable';
      var thead = document.createElement('thead');
      var trh = document.createElement('tr');
      (t.columns || []).forEach(function (c) {
        var th = document.createElement('th');
        th.textContent = c;
        trh.appendChild(th);
      });
      thead.appendChild(trh);
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      t.rows.forEach(function (r) {
        var tr = document.createElement('tr');
        r.forEach(function (c, i) {
          var td = document.createElement('td');
          if (i === 0) {
            td.className = 'c-badge';
            var b = el('span', 'badge', c);
            td.appendChild(b);
          } else if (i === 2) {
            td.className = 'c-person';
            td.textContent = c;
          } else if (i === 3) {
            td.className = 'c-backup';
            td.textContent = c;
          } else {
            td.textContent = c;
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      bubble.appendChild(wrap);
      bubble.appendChild(el('div', 'tbl-foot', '💡 在企业微信搜名字即可发起会话'));
      row.appendChild(bubble);
    } else {
      row.appendChild(el('div', 'bubble', (d && d.answer) || '出了点小问题，再问一次试试～'));
    }
    chat.appendChild(row);
    scrollBottom();
  }

  function addMe(text) {
    var row = el('div', 'row me');
    row.appendChild(el('div', 'bubble', text));
    chat.appendChild(row);
    scrollBottom();
  }

  function addTyping() {
    var row = el('div', 'row bot');
    row.appendChild(el('div', 'bubble-avatar', '🤖'));
    var bubble = el('div', 'bubble');
    var t = el('div', 'typing');
    t.appendChild(el('i'));
    t.appendChild(el('i'));
    t.appendChild(el('i'));
    bubble.appendChild(t);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollBottom();
    return row;
  }

  function ask(q) {
    q = (q || '').trim();
    if (!q || sending) return;
    sending = true;
    sendBtn.disabled = true;
    addMe(q);
    var typingRow = addTyping();
    var started = Date.now();

    fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: q })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var wait = Math.max(0, 450 - (Date.now() - started)); // 至少显示一下输入动画
      setTimeout(function () {
        chat.removeChild(typingRow);
        addBotRich(d);
        sending = false;
        sendBtn.disabled = false;
      }, wait);
    })
    .catch(function () {
      chat.removeChild(typingRow);
      addBot('网络开小差了，请再发一次试试～');
      sending = false;
      sendBtn.disabled = false;
    });
  }

  sendBtn.addEventListener('click', function () {
    ask(input.value);
    input.value = '';
    input.style.height = 'auto';
    input.focus();
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 96) + 'px';
  });

  document.getElementById('chips').addEventListener('click', function (e) {
    if (e.target.classList.contains('chip')) ask(e.target.dataset.q);
  });

  // 开场
  addSysTip('今天');
  addBot('你好呀，我是分工小助手 👋\n\n什么事该找哪个部门、找哪位同事，直接用大白话问我，秒回对接人。\n\n👇 可以点下面的快捷问题，也可以直接输入，比如：\n「报销被驳回了找谁」「香港」「内贸销售」');
})();
</script>
</body>
</html>
